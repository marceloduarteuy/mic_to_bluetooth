name: mic_to_bluetooth
description: Stream microphone audio to Bluetooth speaker with ducking support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth connectivity
  flutter_blue_plus: ^1.31.0

  # Audio session management (ducking, audio focus)
  audio_session: ^0.1.18

  # Audio recording and playback
  flutter_sound: ^9.2.13

  # Runtime permissions
  permission_handler: ^11.3.0

  # State management
  provider: ^6.1.1

  # UI utilities
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
